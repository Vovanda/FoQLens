# Does a question tell at 4 layers that it needs 8 (Volodya 19.09: can the question say how many layers it needs?).
# The hybrid, depths 3 to 8 each predicting the address from layer 8 on; the policy stops at 4 or reads to 8.
corpus = "configs/small-corpus.toml"
corpora = ["triviaqa", "nq_open", "squad_v2"]
