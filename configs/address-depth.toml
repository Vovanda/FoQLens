# How deep the working address must read: the two forward sources that passed configs/address.toml; the first N layers
# at the base projected onto the layers after N, for every N below (E2B has 35 layers). Few layers carry little, many
# leave few to the zones.
corpus = "configs/small-corpus.toml"
corpora = ["triviaqa", "nq_open", "squad_v2"]
sources = ["neuron_activity", "head_energy", "hybrid"]
depths = [1, 2, 4, 6, 8, 12, 18, 24]
# Relative ridge: alpha is this times the mean variance of an early block times the calibration size. A starting
# value, tried at three scales: early blocks outnumber the calibration questions (NQ: 162), so the shrinkage matters.
ridges = [0.01, 0.1, 1.0]
base_level = "d2"
base = "bartowski-Q2_K"
# Windows [start, end) the address is read from, beside the depths' [0, N) (Volodya 19.09: read layers 4, 5 and 6,
# not all before them): the pass still runs to the end, the window leaves out the layers close to the tokens.
windows = [[2, 6], [3, 6], [4, 6], [5, 6], [4, 8], [6, 8]]
