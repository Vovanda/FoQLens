# The oracles by trying (Volodya 19.09: ideal models first, the minimal mask is the ideal): on the small corpus's
# laid-out questions (5% known, 5% unknown), every group - a layer's attention or its MLP - lifted from D2 to D8 and
# dropped from D8 to D2, and the minimal mask within 0.02 nats of the answer's NLL with every block at D8.
# The tolerance is a first guess, not measured: the run records every prefix's NLL, so it is chosen again from the
# spread it shows.
corpus = "configs/small-corpus.toml"
base = "bartowski-Q2_K"
low = "d2"
high = "d8"
tolerance = 0.02
batch_tokens = 32768
# the likelihood is read on the model's own reply at full precision (E001's bf16 answers of the whole corpus): the
# dataset's first reference is its spelling - TriviaQA's capitals, NQ's first of several - and cost 15-28 nats at D8
# on questions the model knows (20.09 night)
replies = "runs/E001-uniform-quantization/e2b-it/answers/bf16"
# the chain that gives the answer at D8, the rest at D2, then the least needed of the rest off (ZERO) while the answer
# stays within this of every block at D8 (Volodya 20.09 01:55); a first guess - the whole sweep is kept, and the
# answers decide
zero_tolerance = 0.1
