# for every run; 20% more give the background and the co-activation graph (60 a corpus was too few for a graph over
# thousands of blocks); 50 a corpus at least, as ARC-Challenge's 5% is 26; 5% of the unknown share on a line of its own.
share = 0.05
calibration_share = 0.2
floor = 50
unknown_share = 0.05
seed = 0
# five parts of 1% of the corpus each (Volodya 19.09 23:40): every oracle takes a part in turn, so after every round
# all the oracles hold masks on 1%, 2%, ... 5% - results on the way, and a stop at any hour leaves the rounds done
shards = 5
