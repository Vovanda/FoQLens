[project]
name = "foqlens"
version = "0.1.0"
description = "Directed quantization bench: weight precision allocated by query meaning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "transformers>=5.5",
    "accelerate",
    "bitsandbytes>=0.46",
    "numpy",
    "scikit-learn",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "ninja>=1.13.2",
    "pytest",
]
eval = ["lm-eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foqlens"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and the model weights", "data: reads the pinned corpora from the hub or its local cache"]
